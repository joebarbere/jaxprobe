[project]
name = "jaxprobe"
version = "0.4.0"
description = "Interpretability tools for JAX models: capture, patch, sparse autoencoders, steering, circuits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["jax>=0.10", "ml_dtypes>=0.4", "numpy>=1.26"]

[project.optional-dependencies]
umap = ["umap-learn>=0.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
